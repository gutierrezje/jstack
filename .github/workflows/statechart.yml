name: Statechart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the statechart regression suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: statechart-tests
          path: skills/statechart/scripts/test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Install locked test dependencies
        working-directory: skills/statechart/scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Explicitly fetch and verify pinned TLC
        run: |
          node skills/statechart/scripts/setup-tlc.ts --download --dir "$RUNNER_TEMP/tlc"
          echo "TLA2TOOLS=$RUNNER_TEMP/tlc/tla2tools.jar" >> "$GITHUB_ENV"
          echo "JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Validate plugin structure
        run: node scripts/validate.mjs
      - name: Check TypeScript
        working-directory: skills/statechart/scripts
        run: npm run typecheck
      - name: Check models, adapter boundaries, and upstream compiler
        working-directory: skills/statechart/scripts
        run: npm test
